# Banco de pruebas — sensor térmico LWIR con anomalías prescritas.
# Tres superficies: pared con dos anomalías localizadas, tubo caliente uniforme,
# suelo sombreado como fondo frío. GT directo de prescribed:.
# prescribed: removed -- it needs ff13517, absent on feat/irsim-lite-gpu. Geometry identical.

schema_version: 17
scene:
  name: inspection_bench_iso
  description: "Static thermal bench with prescribed anomalies — LWIR camera test"
  weather_file: /tmp/irsim_render_cost/iso_weather_48h.csv
  atmosphere_preset: us_standard_clear
  environment_preset: /tmp/irsim_render_cost/env_isothermal.yaml
  site: {latitude_deg: 37.5, longitude_deg: 127.0, altitude_m: 50.0}
  start_utc: "2024-06-21T02:00:00Z"

  thermal:
    spin_up_hours: 6.0
    tick_s: 60.0

    surfaces:
      # Pared: concreto con dos anomalías localizadas (fuga de vapor + rodamiento)
      - name: wall
        material: concrete
        tilt_deg: 90.0
        azimuth_deg: 180.0
        patch:
          origin_m: [-2.0, 5.0, 0.0]
          u_axis: [1.0, 0.0, 0.0]
          v_axis: [0.0, 0.0, 1.0]
          n_u: 8
          n_v: 6
          du_m: 0.5
          dv_m: 0.5
          thickness_m: 0.20
          frame: world
          prim_path: /World/wall

      # Tubo: acero oxidado uniformemente caliente (tubo de vapor activo)
      - name: hot_pipe
        material: rusted_steel
        tilt_deg: 0.0
        patch:
          origin_m: [-0.15, 3.5, 0.9]
          u_axis: [1.0, 0.0, 0.0]
          v_axis: [0.0, 1.0, 0.0]
          n_u: 2
          n_v: 8
          du_m: 0.15
          dv_m: 0.15
          thickness_m: 0.005
          frame: world
          prim_path: /World/hot_pipe

      # Suelo: concreto sombreado, sin anomalía (fondo frío de referencia)
      - name: cold_floor
        material: concrete
        tilt_deg: 0.0
        shaded: true
        patch:
          origin_m: [-2.0, 1.0, 0.0]
          u_axis: [1.0, 0.0, 0.0]
          v_axis: [0.0, 1.0, 0.0]
          n_u: 8
          n_v: 8
          du_m: 0.5
          dv_m: 0.5
          thickness_m: 0.10
          frame: world
          prim_path: /World/cold_floor
